<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>르홈 커튼 설치 리뷰 · 거실 작은방1 작은방2 안방 알파룸</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f5f2ee;--card:#fff;--ink:#292521;--muted:#786f68;--line:#e4ddd6;--brand:#8a6b55;--danger:#b54b42;--soft:#f7f0ea}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.65;word-break:keep-all}
.wrap{max-width:980px;margin:auto;padding:12px 10px 90px}
.hero{background:linear-gradient(135deg,#725643,#a78369);color:#fff;border-radius:22px;padding:26px 20px;margin-bottom:10px}
.hero h1{margin:4px 0 8px;font-size:28px}.hero p{margin:0;font-size:14px;opacity:.94}
.toolbar{position:sticky;top:0;z-index:30;display:flex;gap:8px;overflow:auto;padding:9px 0;background:rgba(245,242,238,.95);backdrop-filter:blur(8px)}
button,label.filebtn{border:0;border-radius:11px;padding:10px 13px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.primary{background:var(--brand);color:#fff}.dark{background:#292521;color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#fff2f0;color:var(--danger);border:1px solid #efcec9}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0}
.card h2{font-size:20px;margin:0 0 12px}.hint{font-size:12px;color:var(--muted);margin-top:-5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:800}
input,select,textarea{width:100%;border:1px solid #ddd6cf;border-radius:10px;padding:10px 11px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
.space-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.space{padding:10px;background:var(--soft);border:1px solid #e1d4c9;border-radius:11px;text-align:center;font-size:13px;font-weight:800}
.progress{display:flex;align-items:center;gap:10px}.bar{flex:1;height:10px;background:#ece5df;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:var(--brand)}
.shot-group{margin-top:18px}.shot-group h3{font-size:17px;margin:0 0 9px}
.shot-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.shot{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.shot.done{border-color:#9fc5ae}
.shot-head{padding:10px 11px;font-weight:800;background:#fffdfa;border-bottom:1px solid var(--line)}
.photo{min-height:200px;background:#f1ece8;display:grid;place-items:center;text-align:center;color:var(--muted);padding:15px}
.photo img{width:100%;height:100%;max-height:360px;object-fit:contain}.actions{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;padding:9px}
.actions label,.actions button{border-radius:9px;padding:8px;font-size:12px;font-weight:800;text-align:center;cursor:pointer}.actions label{border:1px solid var(--line);background:#fff}.actions button{border:1px solid #efceca;background:#fff4f2;color:var(--danger)}
.shot textarea{border-radius:0;border-width:1px 0 0;min-height:70px}
.draft{min-height:500px;line-height:1.8}.preview{white-space:pre-wrap;background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:14px;min-height:120px}
.status{font-size:12px;font-weight:800;color:#6d5241;min-height:20px}
@media(max-width:720px){.grid,.shot-grid{grid-template-columns:1fr}.full{grid-column:auto}.space-grid{grid-template-columns:1fr 1fr}.hero h1{font-size:24px}.actions{grid-template-columns:1fr 1fr}.actions button{grid-column:1/-1}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero">
<small>LEHOME CURTAIN INSTALLATION REVIEW</small>
<h1>대구 수성구 만촌동 르홈 · 우리집 커튼 설치 리뷰</h1>
<p>거실, 작은방1, 작은방2, 안방, 알파룸까지 총 5개 공간의 커튼 설치 전후와 시공 디테일을 기록하는 현장용 index입니다.</p>
</header>

<div class="toolbar">
<button class="primary" id="recordBtn">✨ 기록형 초안</button>
<button class="dark" id="blogBtn">N 자연스러운 설치 후기</button>
<button class="ghost" id="copyBtn">📋 글 복사</button>
<button class="ghost" id="saveBtn">💾 저장</button>
<button class="ghost" id="exportBtn">📄 사진 포함 HTML 저장</button>
<button class="danger" id="resetBtn">전체 초기화</button>
</div>
<div class="status" id="status"></div>

<section class="card">
<h2>1. 설치 기본정보</h2>
<div class="grid">
<div class="field"><label>업체명</label><input id="store" value="르홈"></div>
<div class="field"><label>지역</label><input id="area" value="대구 수성구 만촌동"></div>
<div class="field"><label>설치일</label><input id="date" type="date"></div>
<div class="field"><label>설치 형태</label><select id="type"><option>커튼</option><option>커튼 + 쉬어커튼</option><option>커튼 + 블라인드</option><option>기타</option></select></div>
<div class="field full"><label>원단 / 색상</label><input id="fabric" placeholder="예: 거실 차르르 화이트, 안방 암막 베이지"></div>
<div class="field full"><label>견적 / 결제 메모</label><input id="price" placeholder="예: 총 견적, 계약금, 잔금, 추가금"></div>
</div>
<div class="space-grid">
<div class="space">거실</div><div class="space">작은방 1</div><div class="space">작은방 2</div><div class="space">안방</div><div class="space">알파룸</div>
</div>
</section>

<section class="card">
<h2>2. 상담·설치 메모</h2>
<div class="grid">
<div class="field full"><label>상담 · 실측</label><textarea id="consult" placeholder="예: 공간별 채광과 가구 색을 보고 원단 추천, 길이와 주름 배수 설명"></textarea></div>
<div class="field"><label>좋았던 점</label><textarea id="good" placeholder="예: 공간별 추천이 좋았음, 설치 깔끔"></textarea></div>
<div class="field"><label>아쉬웠던 점</label><textarea id="bad" placeholder="예: 색감 차이, 일정, 추가금 등"></textarea></div>
<div class="field"><label>기사님 · 업체 응대</label><textarea id="service" placeholder="예: 시간 준수, 설명 친절, 마무리 안내"></textarea></div>
<div class="field"><label>설치 완성도</label><textarea id="finish" placeholder="예: 주름 균일, 레일 깔끔, 하단 길이 일정"></textarea></div>
<div class="field full"><label>우리집 분위기 변화 · 총평</label><textarea id="personal" placeholder="예: 커튼 설치 후 집이 훨씬 따뜻하고 완성된 느낌"></textarea></div>
</div>
</section>

<section class="card">
<h2>3. 공간별 사진 촬영</h2>
<p class="hint">각 공간을 설치 전 → 완성 원경 → 원단/주름 → 채광 또는 암막 순서로 기록합니다.</p>
<div class="progress"><strong id="progressText">0/0</strong><div class="bar"><div class="fill" id="fill"></div></div></div>
<div id="groups"></div>
</section>

<section class="card">
<h2>4. 글 생성</h2>
<textarea id="draft" class="draft" placeholder="상단의 초안 생성 버튼을 눌러주세요."></textarea>
</section>

<section class="card">
<h2>5. 미리보기</h2>
<div id="preview" class="preview">생성된 글이 여기에 표시됩니다.</div>
</section>
</main>

<script>
(()=>{
const KEY='lehome_curtain_5rooms_v2';
const $=id=>document.getElementById(id);
const groups=[
['A. 공통 설치 과정',[
['COMMON1','설치 전 집 전체','커튼 설치 전 집 전체 분위기'],
['COMMON2','원단 · 컬러 확인','실제 설치할 원단과 색상'],
['COMMON3','레일 · 브라켓 설치','레일과 브라켓 시공 과정'],
['COMMON4','기사님 설치 과정','커튼 걸기, 길이와 주름 맞춤']]],
['B. 거실',[
['L1','거실 설치 전','창 전체와 가구가 보이게'],
['L2','거실 완성 원경','거실 전체 인테리어와 함께'],
['L3','거실 원단 · 주름','질감과 주름 간격'],
['L4','거실 자연광','낮에 빛이 들어오는 모습'],
['L5','거실 열고 닫은 비교','개방감과 닫았을 때 분위기']]],
['C. 작은방 1',[
['R11','작은방1 설치 전','창과 방 전체'],
['R12','작은방1 완성','방 전체와 커튼'],
['R13','작은방1 원단 디테일','주름과 하단 길이'],
['R14','작은방1 채광','닫았을 때 밝기']]],
['D. 작은방 2',[
['R21','작은방2 설치 전','창과 방 전체'],
['R22','작은방2 완성','방 전체와 커튼'],
['R23','작은방2 원단 디테일','주름과 하단 길이'],
['R24','작은방2 채광','닫았을 때 빛 조절']]],
['E. 안방',[
['M1','안방 설치 전','창과 침실 분위기'],
['M2','안방 완성 원경','침대와 커튼이 함께 보이게'],
['M3','안방 암막 확인','낮에 닫아 빛 차단 확인'],
['M4','안방 원단 · 주름','암막 원단과 마감'],
['M5','안방 열린 모습','열었을 때 채광']]],
['F. 알파룸',[
['A1','알파룸 설치 전','공간 용도와 창'],
['A2','알파룸 완성','공간 전체와 커튼'],
['A3','알파룸 원단 디테일','주름과 질감'],
['A4','알파룸 채광','빛 조절 정도']]],
['G. 최종 마무리',[
['F1','설치 전후 비교','같은 구도로 Before / After'],
['F2','상단 레일 디테일','레일과 상단 주름'],
['F3','하단 길이 디테일','바닥과 커튼 끝단 간격'],
['F4','우리집 최종 분위기','가장 마음에 드는 완성 사진']]]
];
let data={photos:{},memos:{}};

function allShots(){return groups.flatMap(g=>g[1])}
function save(){data.fields={};document.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>data.fields[e.id]=e.value);localStorage.setItem(KEY,JSON.stringify(data));status('저장했습니다.')}
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||'{}');data.photos=data.photos||{};data.memos=data.memos||{};Object.entries(data.fields||{}).forEach(([k,v])=>{if($(k))$(k).value=v})}catch{data={photos:{},memos:{}}}}
function status(t){$('status').textContent=t;clearTimeout(status.x);status.x=setTimeout(()=>$('status').textContent='',2200)}
function compress(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let w=i.width,h=i.height,m=1500;if(w>m||h>m){let k=Math.min(m/w,m/h);w*=k;h*=k}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);res(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function render(){
 let box=$('groups');box.innerHTML='';
 groups.forEach(g=>{let sec=document.createElement('div');sec.className='shot-group';sec.innerHTML='<h3>'+g[0]+'</h3><div class="shot-grid"></div>';let grid=sec.querySelector('.shot-grid');
 g[1].forEach(s=>{let d=document.createElement('div');d.className='shot'+(data.photos[s[0]]?' done':'');d.innerHTML=`<div class="shot-head">${s[1]}</div><div class="photo">${data.photos[s[0]]?`<img src="${data.photos[s[0]]}">`:`<div>🪟<br><strong>${s[1]}</strong><br><small>${s[2]}</small></div>`}</div><div class="actions"><label>📷 촬영<input hidden type="file" accept="image/*" capture="environment"></label><label>🖼 보관함<input hidden type="file" accept="image/*"></label><button>삭제</button></div><textarea placeholder="사진 메모: ${s[2]}">${data.memos[s[0]]||''}</textarea>`;
 d.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=async()=>{let f=inp.files?.[0];if(!f)return;data.photos[s[0]]=await compress(f);save();render()});
 d.querySelector('button').onclick=()=>{delete data.photos[s[0]];save();render()};
 d.querySelector('textarea').oninput=e=>{data.memos[s[0]]=e.target.value;save();update()};
 grid.appendChild(d)});
 box.appendChild(sec)});
 update()
}
function update(){let all=allShots(),done=all.filter(s=>data.photos[s[0]]).length;$('progressText').textContent=`${done}/${all.length}`;$('fill').style.width=(done/all.length*100)+'%'}
function photoMemo(){return groups.map(g=>{let a=g[1].map(s=>data.memos[s[0]]?`- ${s[1]}: ${data.memos[s[0]]}`:'').filter(Boolean);return a.length?g[0]+'\n'+a.join('\n'):''}).filter(Boolean).join('\n\n')}
function collect(){let o={};document.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>o[e.id]=e.value);return o}
function setDraft(t){$('draft').value=t;$('preview').textContent=t;save()}
$('recordBtn').onclick=()=>{let d=collect();setDraft(`[르홈 커튼 설치 기록]

업체: ${d.store}
지역: ${d.area}
설치일: ${d.date||'-'}
설치 공간: 거실 / 작은방1 / 작은방2 / 안방 / 알파룸
설치 형태: ${d.type}
원단·색상: ${d.fabric||'-'}
견적·결제: ${d.price||'-'}

[상담·실측]
${d.consult||'-'}

[좋았던 점]
${d.good||'-'}

[아쉬웠던 점]
${d.bad||'-'}

[기사님·업체 응대]
${d.service||'-'}

[설치 완성도]
${d.finish||'-'}

[우리집 분위기 변화]
${d.personal||'-'}

[공간별 사진 메모]
${photoMemo()||'사진 메모 없음'}`)}
$('blogBtn').onclick=()=>{let d=collect();setDraft(`새집 커튼 설치를 위해 대구 수성구 만촌동 르홈에서 거실, 작은방1, 작은방2, 안방, 알파룸까지 총 5개 공간 시공을 진행했습니다.

처음 상담과 실측에서는 ${d.consult||'각 공간의 창 크기와 채광, 사용할 공간의 용도에 맞춰 원단과 색상을 확인했습니다.'}

거실은 커튼 설치 전과 후의 변화가 가장 크게 느껴진 공간이었습니다. 설치 후에는 창만 가리는 느낌이 아니라 거실 전체가 훨씬 부드럽고 정돈된 분위기로 바뀌었습니다. 자연광이 원단을 통과했을 때의 느낌과 커튼을 열고 닫았을 때의 공간감도 함께 확인했습니다.

작은방1과 작은방2는 각각 방의 용도와 가구 색에 맞춰 커튼이 어떻게 어울리는지 살펴봤습니다. 같은 집 안에서도 방마다 채광이 달라 실제 설치 후 밝기와 비침 정도를 따로 확인하는 게 좋았습니다.

안방은 특히 암막 정도를 중요하게 봤습니다. 낮에 커튼을 닫아 실제 빛 차단 정도를 확인하고, 원단 두께와 주름, 바닥과의 길이까지 가까이에서 체크했습니다.

알파룸도 설치를 마치고 나니 공간이 한층 더 완성된 느낌이 들었습니다. 작은 공간이라도 커튼이 들어가면 전체 분위기가 생각보다 크게 달라졌습니다.

설치 과정에서 좋았던 점은 ${d.good||'공간별로 설치 전후 차이가 분명했고 전체적인 마감이 깔끔했다는 점입니다.'}
업체와 기사님 응대는 ${d.service||'설치 과정과 마무리를 차분하게 확인할 수 있었습니다.'}
${d.bad?`아쉬웠던 점이나 체크할 부분은 ${d.bad}`:''}

전체적으로 ${d.personal||'거실부터 작은방1, 작은방2, 안방, 알파룸까지 커튼이 모두 설치되고 나니 새집이 한층 더 집다운 분위기로 완성된 느낌이었습니다.'}

커튼은 원단 샘플만 볼 때와 실제 집에 설치했을 때의 느낌이 다를 수 있어서, 설치 전후를 같은 구도로 촬영하고 자연광·암막·주름·하단 길이까지 함께 확인해보는 것을 추천합니다.`)}
$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('draft').value);status('글을 복사했습니다.')}
$('saveBtn').onclick=save;
$('resetBtn').onclick=()=>{if(confirm('모든 입력과 사진을 초기화할까요?')){localStorage.removeItem(KEY);location.reload()}}
$('exportBtn').onclick=()=>{save();let blob=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='르홈_커튼설치_거실_작은방1_작은방2_안방_알파룸.html';a.click()}
$('draft').oninput=e=>$('preview').textContent=e.target.value;
document.addEventListener('input',e=>{if(e.target.id!=='draft')save()});
load();render();$('preview').textContent=$('draft').value||'생성된 글이 여기에 표시됩니다.';
})();
</script>
</body>
</html>
